<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Trade AI - Top 10</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #e2e8f0; line-height: 1.5; }
    h1, h2 { color: #38bdf8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin: 20px 0; }
    .card { background: #1e293b; padding: 16px; border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95em; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #1e293b; }
    .positive { color: #4ade80; }
    .negative { color: #f87171; }
    .insight { font-size: 0.85em; }
    button { background: #0ea5e9; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; margin: 4px; }
    button:hover { background: #0284c7; }
    input { padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
    .news-item { margin: 8px 0; padding: 8px; background: #0f172a; border-radius: 8px; }
    .news-item a { color: #38bdf8; text-decoration: none; }
    .news-item a:hover { text-decoration: underline; }
    #portfolio input { width: 100px; margin-right: 6px; }
    .disclaimer { background: #7f1d1d; padding: 10px; border-radius: 8px; font-size: 0.9em; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>Crypto Trade AI</h1>
  <div class="disclaimer">⚠️ 교육용 데모입니다. 투자 조언이 아닙니다. 암호화폐 거래는 높은 위험을 동반합니다.</div>
  <p>시가총액 Top 1-10 • 실시간 데이터 + AI 인사이트</p>
  <button onclick="loadAll()">전체 새로고침</button>
  <label><input type="checkbox" id="auto" checked> 자동 새로고침 (60초)</label>
  <div id="status">Loading...</div>

  <div class="grid">
    <div class="card"><h2>Fear & Greed</h2><div id="fng">Loading...</div></div>
    <div class="card"><h2>글로벌 마켓</h2><div id="global">Loading...</div></div>
    <div class="card"><h2>트렌딩</h2><div id="trending">Loading...</div></div>
  </div>

  <h2>Top 10 Cryptocurrencies</h2>
  <input id="search" placeholder="코인 검색..." oninput="filterTable()" style="margin-bottom:10px;width:200px;">
  <table>
    <thead>
      <tr>
        <th>#</th><th>코인</th><th>가격</th><th>24h %</th><th>7d %</th><th>시총</th><th>거래량</th><th>AI 인사이트</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <h2>최신 암호화폐 뉴스</h2>
  <div id="news">Loading news...</div>

  <h2>포트폴리오 트래커 (브라우저에 저장)</h2>
  <div id="portfolio">
    <input id="coin-input" placeholder="BTC" />
    <input id="amount-input" type="number" step="any" placeholder="수량" />
    <button onclick="addHolding()">추가</button>
    <div id="portfolio-total"></div>
    <div id="holdings"></div>
  </div>

  <script>
    let coinsData = [];
    let autoTimer;

    async function loadAll() {
      document.getElementById('status').textContent = '새로고치는 중...';
      await Promise.all([loadTop10(), loadFNG(), loadGlobal(), loadNews(), loadTrending()]);
      document.getElementById('status').textContent = '업데이트: ' + new Date().toLocaleTimeString();
      loadPortfolio();
    }

    async function loadTop10() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10&page=1&sparkline=false&price_change_percentage=1h,24h,7d');
        coinsData = await res.json();
        renderTable(coinsData);
      } catch(e) { console.error(e); }
    }

    function renderTable(list) {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      list.forEach((coin, i) => {
        const c24 = coin.price_change_percentage_24h || 0;
        const c7 = coin.price_change_percentage_7d_in_currency || 0;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${coin.market_cap_rank}</td>
          <td><img src="${coin.image}" width="18" style="vertical-align:middle;margin-right:4px"><strong>${coin.name}</strong> (${coin.symbol.toUpperCase()})</td>
          <td>$${coin.current_price.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
          <td class="${c24>=0?'positive':'negative'}">${c24.toFixed(2)}%</td>
          <td class="${c7>=0?'positive':'negative'}">${c7.toFixed(2)}%</td>
          <td>$${(coin.market_cap/1e9).toFixed(2)}B</td>
          <td>$${(coin.total_volume/1e9).toFixed(2)}B</td>
          <td class="insight">${generateInsight(coin)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterTable() {
      const q = document.getElementById('search').value.toLowerCase();
      const filtered = coinsData.filter(c => c.name.toLowerCase().includes(q) || c.symbol.toLowerCase().includes(q));
      renderTable(filtered);
    }

    function generateInsight(coin) {
      const change = coin.price_change_percentage_24h || 0;
      let tips = [];
      if (change > 5) tips.push('🚀 강한 상승');
      else if (change > 1) tips.push('📈 약세 불');
      else if (change < -5) tips.push('⚠️ 강한 하락');
      else if (change < -1) tips.push('📉 약세 베어');
      else tips.push('↔️ 횡보');
      if (coin.total_volume > 5e9) tips.push('고거래량');
      if (coin.market_cap_rank <= 3) tips.push('메이저');
      return tips.join(' • ') + '<br><small>투자 조언 아님</small>';
    }

    async function loadFNG() {
      try {
        const res = await fetch('https://api.alternative.me/fng/?limit=1');
        const data = await res.json();
        const d = data.data[0];
        const val = Number(d.value);
        let color = '#f87171';
        if (val > 75) color = '#4ade80';
        else if (val > 50) color = '#fbbf24';
        else if (val > 25) color = '#fb923c';
        document.getElementById('fng').innerHTML = `<div style="font-size:2.2em;font-weight:bold;color:${color}">${val}</div><div>${d.value_classification}</div>`;
      } catch(e) { document.getElementById('fng').textContent = 'Error'; }
    }

    async function loadGlobal() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/global');
        const g = (await res.json()).data;
        document.getElementById('global').innerHTML = `
          <div>총 시총: $${(g.total_market_cap.usd/1e12).toFixed(2)}T</div>
          <div>24h: <span class="${g.market_cap_change_percentage_24h_usd>=0?'positive':'negative'}">${g.market_cap_change_percentage_24h_usd.toFixed(2)}%</span></div>
          <div>BTC 점유율: ${g.market_cap_percentage.btc.toFixed(1)}%</div>
          <div>ETH 점유율: ${g.market_cap_percentage.eth.toFixed(1)}%</div>
        `;
      } catch(e) { document.getElementById('global').textContent = 'Error'; }
    }

    async function loadTrending() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/search/trending');
        const data = await res.json();
        const coins = data.coins.slice(0,5);
        document.getElementById('trending').innerHTML = coins.map(c => 
          `<div>${c.item.name} (${c.item.symbol.toUpperCase()}) • #${c.item.market_cap_rank}</div>`
        ).join('');
      } catch(e) { document.getElementById('trending').textContent = 'Error'; }
    }

    async function loadNews() {
      try {
        const res = await fetch('https://cryptocurrency.cv/api/news?limit=6');
        const data = await res.json();
        const newsDiv = document.getElementById('news');
        newsDiv.innerHTML = '';
        (data.articles || []).forEach(a => {
          const div = document.createElement('div');
          div.className = 'news-item';
          div.innerHTML = `<a href="${a.link}" target="_blank">${a.title}</a><br><small>${a.source} • ${a.timeAgo || ''}</small>`;
          newsDiv.appendChild(div);
        });
      } catch(e) { document.getElementById('news').textContent = '뉴스를 불러올 수 없습니다'; }
    }

    function loadPortfolio() {
      const holdings = JSON.parse(localStorage.getItem('cryptoHoldings') || '[]');
      const div = document.getElementById('holdings');
      const totalDiv = document.getElementById('portfolio-total');
      if (!holdings.length) { div.innerHTML = '<p>아직 추가된 코인이 없습니다.</p>'; totalDiv.textContent = ''; return; }
      let total = 0;
      let html = '<ul>';
      holdings.forEach((h, i) => {
        const coin = coinsData.find(c => c.symbol.toUpperCase() === h.symbol.toUpperCase());
        const value = coin ? coin.current_price * h.amount : 0;
        total += value;
        html += `<li>${h.symbol.toUpperCase()}: ${h.amount} ≈ $${value.toFixed(2)} <button onclick="removeHolding(${i})">삭제</button></li>`;
      });
      html += '</ul>';
      div.innerHTML = html;
      totalDiv.innerHTML = `<strong>총 가치: $${total.toFixed(2)}</strong>`;
    }

    function addHolding() {
      const symbol = document.getElementById('coin-input').value.trim();
      const amount = parseFloat(document.getElementById('amount-input').value);
      if (!symbol || isNaN(amount)) return;
      const holdings = JSON.parse(localStorage.getItem('cryptoHoldings') || '[]');
      holdings.push({symbol, amount});
      localStorage.setItem('cryptoHoldings', JSON.stringify(holdings));
      document.getElementById('coin-input').value = '';
      document.getElementById('amount-input').value = '';
      loadPortfolio();
    }

    function removeHolding(i) {
      const holdings = JSON.parse(localStorage.getItem('cryptoHoldings') || '[]');
      holdings.splice(i, 1);
      localStorage.setItem('cryptoHoldings', JSON.stringify(holdings));
      loadPortfolio();
    }

    function startAuto() {
      clearInterval(autoTimer);
      if (document.getElementById('auto').checked) {
        autoTimer = setInterval(loadAll, 60000);
      }
    }

    document.getElementById('auto').addEventListener('change', startAuto);
    loadAll();
    startAuto();
  </script>
</body>
</html>
