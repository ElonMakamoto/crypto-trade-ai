name: Instagram Auto

on:
  schedule:
    # every 5 hours (UTC 00, 05, 10, 15, 20)
    - cron: "0 */5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Make media + update site, but don't upload to Instagram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-auto
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: instagram_auto/requirements.txt

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r instagram_auto/requirements.txt

      - name: Restore Instagram session
        env:
          IG_SESSION_JSON: ${{ secrets.IG_SESSION_JSON }}
        run: |
          if [ -n "$IG_SESSION_JSON" ]; then
            mkdir -p instagram_auto/state
            printf '%s' "$IG_SESSION_JSON" > instagram_auto/state/ig_session.json
          fi

      - name: Run bot
        working-directory: instagram_auto
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          IG_BACKEND: ${{ vars.IG_BACKEND || 'instagrapi' }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE || '@yourpage' }}
          ACCENT_COLOR: ${{ vars.ACCENT_COLOR || '#FFD400' }}
          POST_MODE: ${{ vars.POST_MODE || 'both' }}
          PUBLIC_MEDIA_BASE_URL: ${{ vars.PUBLIC_MEDIA_BASE_URL || 'https://chedlab.org/instagram/media' }}
          # push the new media first so Cloudflare serves it before the Graph API fetches it
          SITE_PUBLISH_HOOK: ../.github/scripts/publish-site.sh
        run: python main.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save state + site
        run: .github/scripts/publish-site.sh
