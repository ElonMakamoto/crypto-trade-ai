name: Naver Blog Auto (Windows + Linux app)

on:
  push:
    branches: [main]
    paths:
      - "naver_blog_auto/**"
      - ".github/workflows/naver-blog-auto-windows.yml"
  pull_request:
    paths:
      - "naver_blog_auto/**"
      - ".github/workflows/naver-blog-auto-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naver-blog-auto-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"  # Korean and emoji in the self-test output
    defaults:
      run:
        working-directory: naver_blog_auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: naver_blog_auto/requirements.txt

      - name: Install
        run: pip install -r requirements.txt pyinstaller

      - name: Self-test from source (uses the Edge that comes with Windows)
        run: python selftest.py

      - name: Stamp version
        shell: bash
        run: echo "${GITHUB_SHA::7}" > version.txt

      - name: Draw the app icon
        run: python make_icon.py

      - name: Build NaverBlogAuto.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name NaverBlogAuto --icon icon.ico
          --add-data "fonts;fonts" --add-data "skills;skills" --add-data "tests/mock_editor.html;tests"
          --add-data "version.txt;." --add-data "icon.png;." --add-data "icon.ico;."
          --collect-all playwright --collect-all tzdata
          app.py

      - name: Self-test the .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\NaverBlogAuto.exe -ArgumentList '--selftest', "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: NaverBlogAuto-windows
          path: |
            naver_blog_auto/dist/NaverBlogAuto.exe
            naver_blog_auto/version.txt

  build-linux:
    # built on the oldest supported Ubuntu so the program also runs on older Linux systems
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: naver_blog_auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: naver_blog_auto/requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt pyinstaller
          python -m playwright install --with-deps chromium

      - name: Self-test from source
        run: python selftest.py

      - name: Stamp version
        run: echo "${GITHUB_SHA::7}" > version.txt

      - name: Draw the app icon
        run: python make_icon.py

      - name: Build NaverBlogAuto-linux
        run: >
          pyinstaller --noconfirm --onefile --windowed --name NaverBlogAuto-linux
          --add-data "fonts:fonts" --add-data "skills:skills" --add-data "tests/mock_editor.html:tests"
          --add-data "version.txt:." --add-data "icon.png:."
          --collect-all playwright --collect-all tzdata
          app.py

      - name: Self-test the Linux program
        run: |
          ./dist/NaverBlogAuto-linux --selftest "$PWD/selftest.txt" || { cat selftest.txt; exit 1; }
          cat selftest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NaverBlogAuto-linux
          path: naver_blog_auto/dist/NaverBlogAuto-linux

  publish:
    # only after both programs built and passed their self-tests
    needs: [build, build-linux]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Publish download (latest)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          EXE=out/NaverBlogAuto-windows/dist/NaverBlogAuto.exe
          [ -f "$EXE" ] || EXE=$(find out -name NaverBlogAuto.exe | head -1)
          VER=$(find out -name version.txt | head -1)
          LINUX=$(find out -name NaverBlogAuto-linux -type f | head -1)
          chmod +x "$LINUX"
          # upload the programs first, then version.txt (what the apps check), then the notes, so an app checking
          # mid-publish never sees a version whose program isn't there yet
          NOTES="build: ${GITHUB_SHA::7} — 자동 빌드된 최신 버전입니다. Windows는 NaverBlogAuto.exe, Linux는 NaverBlogAuto-linux를 받아 실행하세요."
          if gh release view naver-blog-auto-latest >/dev/null 2>&1; then
            gh release upload naver-blog-auto-latest "$EXE" "$LINUX" --clobber
            gh release upload naver-blog-auto-latest "$VER" --clobber
            gh release edit naver-blog-auto-latest --notes "$NOTES"
          else
            gh release create naver-blog-auto-latest "$EXE" "$LINUX" "$VER" \
              --title "Naver Blog Auto (Windows · Linux)" --target "$GITHUB_SHA" --notes "$NOTES"
          fi
