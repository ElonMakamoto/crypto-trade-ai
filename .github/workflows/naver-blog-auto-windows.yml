name: Naver Blog Auto (Windows app)

on:
  push:
    branches: [main]
    paths:
      - "naver_blog_auto/**"
      - ".github/workflows/naver-blog-auto-windows.yml"
  pull_request:
    paths:
      - "naver_blog_auto/**"
      - ".github/workflows/naver-blog-auto-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naver-blog-auto-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"  # Korean and emoji in the self-test output
    defaults:
      run:
        working-directory: naver_blog_auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: naver_blog_auto/requirements.txt

      - name: Install
        run: pip install -r requirements.txt pyinstaller

      - name: Self-test from source (uses the Edge that comes with Windows)
        run: python selftest.py

      - name: Stamp version
        shell: bash
        run: echo "${GITHUB_SHA::7}" > version.txt

      - name: Draw the app icon
        run: python make_icon.py

      - name: Build NaverBlogAuto.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name NaverBlogAuto --icon icon.ico
          --add-data "fonts;fonts" --add-data "skills;skills" --add-data "tests/mock_editor.html;tests"
          --add-data "version.txt;." --add-data "icon.png;." --add-data "icon.ico;."
          --collect-all playwright --collect-all tzdata
          app.py

      - name: Self-test the .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\NaverBlogAuto.exe -ArgumentList '--selftest', "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: NaverBlogAuto
          path: naver_blog_auto/dist/NaverBlogAuto.exe

      - name: Publish download (latest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # keep the release in place (never delete it): upload the new .exe first, then the version file the app
          # reads, then the notes, so an app checking mid-build never sees a version whose .exe isn't there yet
          NOTES="build: ${GITHUB_SHA::7} — 자동 빌드된 최신 버전입니다. NaverBlogAuto.exe를 받아 실행하세요."
          if gh release view naver-blog-auto-latest >/dev/null 2>&1; then
            gh release upload naver-blog-auto-latest dist/NaverBlogAuto.exe --clobber
            gh release upload naver-blog-auto-latest version.txt --clobber
            gh release edit naver-blog-auto-latest --notes "$NOTES"
          else
            gh release create naver-blog-auto-latest dist/NaverBlogAuto.exe version.txt \
              --title "Naver Blog Auto for Windows" --target "$GITHUB_SHA" --notes "$NOTES"
          fi
