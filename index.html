<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crypto Trade AI</title>
<style>
body{font-family:system-ui;background:#0f172a;color:#e2e8f0;padding:20px;margin:0}
h1,h2{color:#38bdf8}
.card{background:#1e293b;padding:16px;border-radius:12px;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:0.95em}
th,td{padding:10px 8px;border-bottom:1px solid #334155;text-align:left}
.positive{color:#4ade80}
.negative{color:#f87171}
.signal{padding:4px 10px;border-radius:6px;font-weight:bold;font-size:0.85em}
.buy{background:#166534;color:#bbf7d0}
.hold{background:#854d0e;color:#fef08a}
.caution{background:#7f1d1d;color:#fecaca}
.ai-box{background:#0f172a;padding:8px;margin:4px 0;border-radius:6px;font-size:0.85em}
button{background:#0ea5e9;color:white;border:none;padding:8px 14px;border-radius:6px;cursor:pointer}
.disclaimer{background:#7f1d1d;padding:12px;border-radius:8px;font-size:0.9em}
.fng-panel{font-size:1.1em;padding:12px;border-radius:10px;text-align:center}
.fng-extreme-fear{background:#7f1d1d;color:#fecaca}
.fng-fear{background:#c2410c;color:#ffedd5}
.fng-neutral{background:#ca8a04;color:#fef9c3}
.fng-greed{background:#16a34a;color:#dcfce7}
.fng-extreme-greed{background:#15803d;color:#bbf7d0}
</style>
</head>
<body>
<h1>Crypto Trade AI</h1>
<div class="disclaimer">⚠️ Educational demo only. Not financial advice. Crypto trading involves high risk.</div>
<p>BTC • ETH • DOGE • ALGO • SOL • SHIB • HAMI</p>
<button onclick="loadAll()">Refresh</button>
<div id="status">Loading...</div>
<div class="card" id="fng">Fear & Greed: Loading...</div>
<table>
<thead>
<tr>
<th>Coin</th>
<th>Price</th>
<th>24h</th>
<th>7d</th>
<th>Market Cap</th>
<th>Signal</th>
<th>AI Analysis</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
<script>
let coinsData=[], fng=50;
const FORCE_IDS = ['bitcoin','ethereum','dogecoin','algorand','solana','shiba-inu','hami'];

function formatPrice(p) {
  if (!p || isNaN(p)) return '$0';
  if (p >= 1) return '$' + p.toLocaleString(undefined, {maximumFractionDigits: 2});
  if (p >= 0.01) return '$' + p.toFixed(4);
  if (p >= 0.0001) return '$' + p.toFixed(6);
  return '$' + p.toFixed(8);
}

function formatMcap(m) {
  if (!m) return '-';
  if (m >= 1e12) return '$' + (m/1e12).toFixed(2) + 'T';
  if (m >= 1e9) return '$' + (m/1e9).toFixed(2) + 'B';
  if (m >= 1e6) return '$' + (m/1e6).toFixed(2) + 'M';
  return '$' + m.toLocaleString();
}

function fngClass(val) {
  if (val <= 25) return 'fng-extreme-fear';
  if (val <= 45) return 'fng-fear';
  if (val <= 55) return 'fng-neutral';
  if (val <= 75) return 'fng-greed';
  return 'fng-extreme-greed';
}

async function loadAll(){
  document.getElementById('status').textContent='Analyzing...';
  const [forceRes, fngRes] = await Promise.all([
    fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids='+FORCE_IDS.join(',')+'&price_change_percentage=24h,7d').then(r=>r.json()),
    fetch('https://api.alternative.me/fng/?limit=1').then(r=>r.json())
  ]);
  fng = Number(fngRes.data[0].value);
  const cls = fngClass(fng);
  document.getElementById('fng').className = 'card fng-panel ' + cls;
  document.getElementById('fng').innerHTML = '<strong>Fear & Greed Index</strong><br><span style="font-size:2em">'+fng+'</span><br>'+fngRes.data[0].value_classification;

  const map = Object.fromEntries(forceRes.map(c => [c.id, c]));
  coinsData = FORCE_IDS.map(id => map[id]).filter(Boolean);
  await render();
  document.getElementById('status').textContent='Updated: '+new Date().toLocaleTimeString();
}

function signal(c){
  let s=0; const c24=c.price_change_percentage_24h||0, c7=c.price_change_percentage_7d_in_currency||0;
  if(c24>3)s+=2; else if(c24>0)s+=1; else if(c24<-3)s-=2; else if(c24<0)s-=1;
  if(c7>5)s+=1; else if(c7<-5)s-=1;
  if(c.total_volume && c.market_cap && c.total_volume/c.market_cap>0.08)s+=1;
  if(fng>75)s-=1; if(fng<25)s+=1;
  if(s>=3) return ['Buy Interest','buy'];
  if(s<=-2) return ['Caution','caution'];
  return ['Hold','hold'];
}

async function ai(c){
  try{
    const r=await fetch('https://cryptocurrency.cv/api/search?q='+encodeURIComponent(c.symbol)+'&limit=2');
    const d=await r.json();
    const titles=(d.articles||[]).map(a=>a.title).join(' | ').slice(0,140);
    const ch=c.price_change_percentage_24h||0;
    let sum= ch>3?'Bullish momentum. ':ch<-3?'Pullback. ':'Sideways. ';
    sum += titles ? 'News: '+titles : 'Limited news';
    const risk= Math.abs(ch)>5?'High volatility':'Relatively stable';
    return sum+'<br><small>Risk: '+risk+'</small>';
  }catch(e){return 'Analysis failed';}
}

async function render(){
  const tb=document.getElementById('tbody');
  tb.innerHTML='';
  for(const c of coinsData){
    const [lab,cls]=signal(c);
    const a=await ai(c);
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><strong>${c.name}</strong> (${c.symbol.toUpperCase()})</td><td>${formatPrice(c.current_price)}</td><td class="${(c.price_change_percentage_24h||0)>=0?'positive':'negative'}">${(c.price_change_percentage_24h||0).toFixed(2)}%</td><td class="${(c.price_change_percentage_7d_in_currency||0)>=0?'positive':'negative'}">${(c.price_change_percentage_7d_in_currency||0).toFixed(2)}%</td><td>${formatMcap(c.market_cap)}</td><td><span class="signal ${cls}">${lab}</span></td><td class="ai-box">${a}</td>`;
    tb.appendChild(tr);
  }
}

loadAll();
</script>
</body>
</html>
