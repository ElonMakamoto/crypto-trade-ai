<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Trade AI - Top 10 Market Cap</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #e2e8f0; }
    h1 { color: #38bdf8; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #1e293b; }
    .positive { color: #4ade80; }
    .negative { color: #f87171; }
    .insight { background: #1e293b; padding: 12px; margin: 8px 0; border-radius: 8px; }
    button { background: #0ea5e9; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0284c7; }
  </style>
</head>
<body>
  <h1>Crypto Trade AI</h1>
  <p>Studying Top 1-10 cryptocurrencies by market cap • AI trading insights</p>
  <button onclick="loadData()">Refresh Data</button>
  <div id="status">Loading...</div>
  <table id="table">
    <thead>
      <tr>
        <th>#</th><th>Coin</th><th>Price</th><th>24h %</th><th>Market Cap</th><th>Volume 24h</th><th>AI Insight</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script>
    async function loadData() {
      const status = document.getElementById('status');
      const tbody = document.getElementById('tbody');
      status.textContent = 'Fetching top 10 cryptos...';
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10&page=1&sparkline=false');
        const coins = await res.json();
        tbody.innerHTML = '';
        coins.forEach((coin, i) => {
          const change = coin.price_change_percentage_24h || 0;
          const changeClass = change >= 0 ? 'positive' : 'negative';
          const insight = generateInsight(coin);
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${i+1}</td>
            <td><strong>${coin.name}</strong> (${coin.symbol.toUpperCase()})</td>
            <td>$${coin.current_price.toLocaleString(undefined, {maximumFractionDigits: 2})}</td>
            <td class="${changeClass}">${change.toFixed(2)}%</td>
            <td>$${(coin.market_cap / 1e9).toFixed(2)}B</td>
            <td>$${(coin.total_volume / 1e9).toFixed(2)}B</td>
            <td><div class="insight">${insight}</div></td>
          `;
          tbody.appendChild(tr);
        });
        status.textContent = 'Updated ' + new Date().toLocaleTimeString();
      } catch (e) {
        status.textContent = 'Error loading data. Try again later.';
        console.error(e);
      }
    }

    function generateInsight(coin) {
      const change = coin.price_change_percentage_24h || 0;
      const vol = coin.total_volume;
      let tips = [];
      if (change > 5) tips.push('🚀 Strong upward momentum');
      else if (change > 1) tips.push('📈 Mild bullish');
      else if (change < -5) tips.push('⚠️ Strong downward pressure');
      else if (change < -1) tips.push('📉 Mild bearish');
      else tips.push('↔️ Sideways / consolidating');

      if (vol > 5e9) tips.push('High volume → strong interest');
      else if (vol < 1e9) tips.push('Lower volume → watch for confirmation');

      if (coin.market_cap_rank <= 3) tips.push('Major coin — lower risk relative to alts');
      else tips.push('Higher volatility expected');

      return tips.join(' • ') + ' <br><small>Not financial advice</small>';
    }

    loadData();
  </script>
</body>
</html>
