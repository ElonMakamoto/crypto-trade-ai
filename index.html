<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Crypto Trade AI</title>
<style>body{font-family:system-ui;background:#0f172a;color:#e2e8f0;padding:20px}h1,h2{color:#38bdf8}.card{background:#1e293b;padding:16px;border-radius:12px;margin:10px 0}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #334155}.positive{color:#4ade80}.negative{color:#f87171}.signal{padding:4px 8px;border-radius:6px;font-weight:bold}.buy{background:#166534}.hold{background:#854d0e}.caution{background:#7f1d1d}.ai-box{background:#0f172a;padding:6px;margin:4px 0;border-radius:4px;font-size:0.85em}button{background:#0ea5e9;color:white;border:none;padding:6px 12px;border-radius:6px;cursor:pointer}.disclaimer{background:#7f1d1d;padding:10px;border-radius:8px}</style>
</head>
<body>
<h1>Crypto Trade AI</h1>
<div class="disclaimer">⚠️ 교육용. 투자 조언 아님. 높은 위험.</div>
<p>BTC • ETH • BNB • SOL • ALGO • DOGE • SHIB • PEPE • FLOKI • BONK</p>
<button onclick="loadAll()">새로고침</button>
<div id="status">Loading...</div>
<div class="card" id="fng">Fear & Greed: Loading...</div>
<table><thead><tr><th>코인</th><th>가격</th><th>24h</th><th>7d</th><th>시그널</th><th>AI 분석</th></tr></thead><tbody id="tbody"></tbody></table>
<script>
let coinsData=[], fng=50;
const FORCE_IDS = [
  'bitcoin','ethereum','binancecoin','solana','algorand',
  'dogecoin','shiba-inu','pepe','floki','bonk'
];

async function loadAll(){
  document.getElementById('status').textContent='분석 중...';
  const [forceRes, fngRes] = await Promise.all([
    fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids='+FORCE_IDS.join(',')+'&price_change_percentage=24h,7d').then(r=>r.json()),
    fetch('https://api.alternative.me/fng/?limit=1').then(r=>r.json())
  ]);
  fng = Number(fngRes.data[0].value);
  document.getElementById('fng').innerHTML='Fear & Greed: <strong>'+fng+'</strong> ('+fngRes.data[0].value_classification+')';

  const map = Object.fromEntries(forceRes.map(c => [c.id, c]));
  coinsData = FORCE_IDS.map(id => map[id]).filter(Boolean);
  await render();
  document.getElementById('status').textContent='업데이트: '+new Date().toLocaleTimeString();
}

function signal(c){
  let s=0; const c24=c.price_change_percentage_24h||0, c7=c.price_change_percentage_7d_in_currency||0;
  if(c24>3)s+=2; else if(c24>0)s+=1; else if(c24<-3)s-=2; else if(c24<0)s-=1;
  if(c7>5)s+=1; else if(c7<-5)s-=1;
  if(c.total_volume && c.market_cap && c.total_volume/c.market_cap>0.08)s+=1;
  if(fng>75)s-=1; if(fng<25)s+=1;
  if(s>=3) return ['매수 관심','buy'];
  if(s<=-2) return ['주의','caution'];
  return ['관망','hold'];
}

async function ai(c){
  try{
    const r=await fetch('https://cryptocurrency.cv/api/search?q='+encodeURIComponent(c.symbol)+'&limit=2');
    const d=await r.json();
    const titles=(d.articles||[]).map(a=>a.title).join(' | ').slice(0,140);
    const ch=c.price_change_percentage_24h||0;
    let sum= ch>3?'상승 모멘텀. ':ch<-3?'조정 중. ':'횡보. ';
    sum += titles ? '뉴스: '+titles : '뉴스 적음';
    const risk= Math.abs(ch)>5?'변동성 높음':'상대적 안정';
    return sum+'<br><small>리스크: '+risk+'</small>';
  }catch(e){return '분석 실패';}
}

async function render(){
  const tb=document.getElementById('tbody');
  tb.innerHTML='';
  for(const c of coinsData){
    const [lab,cls]=signal(c);
    const a=await ai(c);
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><strong>${c.name}</strong> (${c.symbol.toUpperCase()})</td><td>$${Number(c.current_price).toLocaleString()}</td><td class="${(c.price_change_percentage_24h||0)>=0?'positive':'negative'}">${(c.price_change_percentage_24h||0).toFixed(2)}%</td><td class="${(c.price_change_percentage_7d_in_currency||0)>=0?'positive':'negative'}">${(c.price_change_percentage_7d_in_currency||0).toFixed(2)}%</td><td><span class="signal ${cls}">${lab}</span></td><td class="ai-box">${a}</td>`;
    tb.appendChild(tr);
  }
}

loadAll();
</script>
</body>
</html>
